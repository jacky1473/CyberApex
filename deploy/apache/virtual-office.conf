# CyberApex Virtual Office - Apache HTTPD mod_wsgi Configuration
# High-Performance setup: Apache serves static assets directly; WSGI handles dynamic routes

<VirtualHost *:80>
    ServerName 192.168.18.131
    ServerAdmin farman@localhost

    DocumentRoot /opt/virtual-office

    # 1. High-Speed Static File Serving (Must be defined BEFORE WSGIScriptAlias /)
    Alias /static /opt/virtual-office/static
    <Directory /opt/virtual-office/static>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        # Enable caching headers
        <IfModule mod_headers.c>
            Header set Cache-Control "max-age=86400, public"
        </IfModule>
    </Directory>

    # 2. WSGI Daemon Configuration
    WSGIDaemonProcess virtualoffice user=farman group=farman processes=1 threads=5 display-name=%{GROUP} home=/opt/virtual-office python-home=/usr
    WSGIProcessGroup virtualoffice
    WSGIScriptAlias / /opt/virtual-office/virtual_office.wsgi

    <Directory /opt/virtual-office>
        <Files virtual_office.wsgi>
            Require all granted
        </Files>
        Require all granted
        Options FollowSymLinks
        AllowOverride None
    </Directory>

    # 3. Gzip / Deflate compression for fast transfer
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    # Custom Logging
    ErrorLog /var/log/httpd/virtual_office_error.log
    CustomLog /var/log/httpd/virtual_office_access.log combined
</VirtualHost>
